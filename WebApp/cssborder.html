<html>
    <head>
        <title>css border</title>
        <style>
            h1
            {
                border-left-style: dashed;
                border-right-style: dotted;
                border-top-style: solid;
                border-bottom-style: double;
                border-width: 5px;
                border-color: red green blue yellow;
            }
            h2{
                
                border: 5px solid red;
            }
        </style>
    </head>
    <body>
        <h1>heading-1</h1>
        <h2>heading-2</h2>
        <h3>heading-3</h3>
    </body>
</html>
