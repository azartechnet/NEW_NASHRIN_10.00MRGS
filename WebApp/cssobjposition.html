<!DOCTYPE html>
<html>
<head>
<style>
.image-container {
  width: 200px;
  height: 300px;
  border: 1px solid black;
  margin-bottom: 25px;
  
}

.image-container img {
  width: 100%;
  height: 100%;
  /* object-fit: cover; */
  /* object-fit: contain; */
  /* object-fit: fill; */
  /* object-fit: scale-down; */
   object-position: 80% 100%;  
}
</style>
</head>
<body>

<h2>Using object-fit: cover</h2>

<p>The object-fit: cover; value preserves the aspect ratio, and the image fills the container. The image will be clipped to fit:</p>

<div class="image-container">
  <img src="images/b1.jpeg" alt="Paris" width="400" height="300">
</div>

<div class="image-container">
  <img src="images/b2.jpeg" alt="Pineapple" width="300" height="300">
</div>

</body>
</html>
